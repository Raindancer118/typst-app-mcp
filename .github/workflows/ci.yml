name: CI

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: typst-community/setup-typst@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start-up test
        run: npm run smoke

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check tag matches package.json
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm pack
      - uses: softprops/action-gh-release@v3
        with:
          files: typst-app-mcp-*.tgz
          generate_release_notes: true
